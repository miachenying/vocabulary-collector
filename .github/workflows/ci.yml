name: Vocabulary Collector CI

on:
  push:
    branches: [v2-dev]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  deterministic-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run deterministic release gate
        run: npm run check:release
