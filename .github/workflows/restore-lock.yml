name: Restore package lock

on:
  push:
    branches: [v2-dev]

permissions:
  contents: write

jobs:
  restore-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2-dev
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate lockfile from pinned package versions
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile when changed
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json && git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo "package-lock.json is already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Milestone 7: restore synchronized package lock"
          git push origin HEAD:v2-dev
