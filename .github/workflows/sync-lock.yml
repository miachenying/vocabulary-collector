name: Sync package lock

on:
  push:
    branches: [v2-dev]

permissions:
  contents: write

jobs:
  sync-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2-dev
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Synchronize package lock
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit synchronized lockfile
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Milestone 7: sync Playwright package lock"
          git push origin HEAD:v2-dev
